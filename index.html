<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pastel Template</title>

<style>

/* PAGE */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    padding: 40px 0;
    background: #f8eef3;
    font-family: Georgia, "Times New Roman", serif;
    color: #5c4b52;
}


/* MAIN TEMPLATE */

.pastel-template {
    width: 700px;
    min-height: 500px;
    margin: 0 auto;
    background: #fff7fa;
    border: 1px solid #e7cbd5;
    box-shadow: 0 5px 20px rgba(120, 80, 100, 0.15);
    overflow: hidden;
}


/* IMAGE AT TOP */

.pastel-image {
    width: 100%;
    height: 200px;

    background-image: url("YOUR-IMAGE-URL-HERE");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* CONTENT */

.pastel-content {
    padding: 30px 40px 40px;
}


/* TITLE */

.pastel-title {
    text-align: center;
    font-size: 28px;
    font-weight: normal;
    color: #b47c92;
    letter-spacing: 2px;
    margin: 0 0 10px 0;
}


/* QUOTE */

.pastel-quote {
    text-align: center;
    font-size: 12px;
    font-style: italic;
    color: #a98b96;
    margin: 0 0 25px 0;
}


/* TEXT BOX */

.pastel-text {
    width: 100%;
    padding: 22px;

    background: #fffafb;

    border: 1px solid #edd9df;

    color: #66545b;

    font-size: 13px;

    line-height: 1.7;

    box-shadow: inset 0 0 12px rgba(180, 124, 146, 0.06);
}


/* LITTLE DECORATION */

.pastel-text::before {
    content: "♡";
    display: block;
    text-align: center;
    color: #d19aae;
    font-size: 18px;
    margin-bottom: 10px;
}

</style>

</head>


<body>


<div class="pastel-template">


    <!-- TOP IMAGE -->

    <div class="pastel-image"></div>


    <!-- CONTENT -->

    <div class="pastel-content">


        <!-- TITLE -->

        <div class="pastel-title">
            Pastel
        </div>


        <!-- QUOTE -->

        <div class="pastel-quote">
            "Your quote goes here."
        </div>


        <!-- TEXT -->

        <div class="pastel-text">

            Your text goes here.

            <br><br>

            Add your character information,
            biography, story, or other content here.

            <br><br>

            You can continue adding your content here.

        </div>


    </div>


</div>


</body>

</html>
