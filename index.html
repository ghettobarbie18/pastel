<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pastel Template</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    padding: 40px 0;
    background: #f8eef3;
    font-family: Georgia, "Times New Roman", serif;
    color: #5c4b52;
}

.pastel-template {
    width: 700px;
    min-height: 500px;
    margin: 0 auto;
    background: #fff7fa;
    border: 1px solid #e7cbd5;
    box-shadow: 0 5px 20px rgba(120,80,100,0.15);
    overflow: hidden;
}

.pastel-image {
    width: 100%;
    height: 200px;
    background-image: url("https://raw.githubusercontent.com/ghettobarbie18/pastel/refs/heads/main/dulce2.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.pastel-content {
    padding: 30px 40px 40px;
}

.pastel-title {
    text-align: center;
    font-size: 28px;
    font-weight: normal;
    color: #b47c92;
    letter-spacing: 2px;
    margin: 0 0 10px 0;
}

.pastel-quote {
    text-align: center;
    font-size: 12px;
    font-style: italic;
    color: #a98b96;
    margin: 0 0 25px 0;
}

.pastel-text {
    width: 100%;
    padding: 22px;
    background: #fffafb;
    border: 1px solid #edd9df;
    color: #66545b;
    font-size: 13px;
    line-height: 1.7;
    box-shadow: inset 0 0 12px rgba(180,124,146,0.06);
}

.pastel-text::before {
    content: "♡";
    display: block;
    text-align: center;
    color: #d19aae;
    font-size: 18px;
    margin-bottom: 10px;
}

</style>

</head>

<body>

<div class="pastel-template">

    <div class="pastel-image"></div>

    <div class="pastel-content">

        <div class="pastel-title">
            Pastel
        </div>

        <div class="pastel-quote">
            "Your quote goes here."
        </div>

        <div class="pastel-text">
            Your text goes here.

            <br><br>

            Add your character information,
            biography, story, or other content here.

            <br><br>

            You can continue adding your content here.
        </div>

    </div>

</div>

</body>
</html>
