<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pastel Aesthetic Template</title>

<style>

.pastel-template {
    width: 700px;
    margin: 40px auto;
    background: #fff7fa;
    border: 1px solid #e7cbd5;
    color: #5c4b52;
    font-family: Georgia, serif;
    box-shadow: 0 5px 20px rgba(120, 80, 100, 0.15);
    overflow: hidden;
}

.pastel-image {
    width: 100%;
    height: 180px;
    background-image: url("https://raw.githubusercontent.com/ghettobarbie18/pastel/refs/heads/main/dulce2.png");
    background-size: cover;
    background-position: center;
}

.pastel-content {
    padding: 25px 35px 35px;
}

.pastel-title {
    text-align: center;
    font-size: 27px;
    color: #b47c92;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.pastel-quote {
    text-align: center;
    font-size: 12px;
    font-style: italic;
    color: #a98b96;
    margin-bottom: 22px;
}

.pastel-text {
    padding: 20px;
    background: #fffafb;
    border: 1px solid #edd9df;
    line-height: 1.6;
    font-size: 13px;
}

</style>

</head>

<body>

<div class="pastel-template">

    <div class="pastel-image"></div>

    <div class="pastel-content">

        <div class="pastel-title">
            Your Title
        </div>

        <div class="pastel-quote">
            "Your quote goes here."
        </div>

        <div class="pastel-text">

            Your main text goes here.

            <br><br>

            Add your character information, writing,
            roleplay text, or other content here.

            <br><br>

            You can add as much text as needed.

        </div>

    </div>

</div>

</body>
</html>
