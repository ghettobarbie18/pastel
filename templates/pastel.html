<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pastel Template</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    padding: 40px 0;
    background: #f8eef3;
    font-family: Georgia, serif;
    color: #5c4b52;
}

.pastel-template {
    position: relative;
    width: 700px;
    margin: 120px auto 40px;
    font-family: Georgia, serif;
}

.pastel-image {
    position: absolute;
    top: -100px;
    left: 0;
    width: 100%;
    height: 180px;
    background-image: url("https://raw.githubusercontent.com/ghettobarbie18/pastel/refs/heads/main/dulce2.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.pastel-content {
    padding: 100px 35px 35px;
    box-shadow: 0 5px 20px rgba(120, 80, 100, 0.15);
}

.pastel-title {
    text-align: center;
    font-size: 27px;
    color: #b47c92;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.pastel-quote {
    text-align: center;
    font-size: 12px;
    font-style: italic;
    color: #a98b96;
    margin-bottom: 22px;
}

.pastel-text {
    padding: 20px;
    background: #fffafb;
    border: 1px solid #edd9df;
    line-height: 1.6;
    font-size: 13px;
}

</style>
</head>

<body>

<div class="pastel-template">

    <div class="pastel-image"></div>

    <div class="pastel-content">

        <div class="pastel-title">
            Pastel
        </div>

        <div class="pastel-quote">
            "Your quote goes here."
        </div>

        <div class="pastel-text">
            Your text goes here.

            <br><br>

            Add your character information,
            biography, story, or other content here.

            <br><br>

            You can continue adding your content here.
        </div>

    </div>

</div>

</body>
</html>
