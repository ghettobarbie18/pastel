<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pastel Template</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: transparent;
}

body {
    font-family: Georgia, serif;
    color: #5c4b52;
}

.pastel-content {
    position: relative;
    width: 700px;
    margin: -100px auto 40px;
    background: transparent;
}

/* IMAGE */
.pastel-image {
    position: relative;
    z-index: 2;
    width: 700px;
    height: 500px;
    margin: 0 auto -25px;
    background-image: url("https://raw.githubusercontent.com/ghettobarbie18/pastel/refs/heads/main/dulce2.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* TEXT BOX */
.pastel-text {
    position: relative;
    z-index: 1;
    width: 500px;
    min-height: 350px;
    margin: 0 auto;
    margin-top: -120px;
    padding: 30px;
    background: linear-gradient(to bottom, #90f0b4, #e1ffe9);
    line-height: 1.6;
    font-size: 13px;
    clip-path: polygon(0 0, 66% 7%, 100% 12%, 100% 100%, 0 100%, 0% 50%);
}

/* TITLE OUTSIDE TEXT BOX */
.pastel-title {
    width: 650px;
    margin: 20px auto 8px;
    text-align: center;
    font-size: 27px;
    color: #b47c92;
    letter-spacing: 2px;
}

/* QUOTE OUTSIDE TEXT BOX */
.pastel-quote {
    width: 650px;
    margin: 0 auto;
    text-align: center;
    font-size: 12px;
    font-style: italic;
    color: #a98b96;
}

</style>
</head>

<body>

<div class="pastel-content">

    <div class="pastel-image"></div>

    <div class="pastel-text">

        Your text goes here.

        <br><br>

        Add your character information,
        biography, story, or other content here.

        <br><br>

        You can continue adding your content here.

    </div>

    <div class="pastel-title">
        Pastel
    </div>

    <div class="pastel-quote">
        "Your quote goes here."
    </div>

</div>

</body>
</html>
